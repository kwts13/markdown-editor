<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Noted.</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cff'/%3E%3Cpath d='M9.5 23V9h3.2l6.8 9V9h3v14h-3.2l-6.8-9v9z' fill='white'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="Sidebar">
    <div class="side-head">
      <span class="brand">Noted<span class="brand-dot">.</span></span>
      <div class="side-actions">
        <button id="btn-new-note" class="icon-btn" title="New note (Ctrl/Cmd+Alt+N)" aria-label="New note">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M11 3H5.5A1.5 1.5 0 0 0 4 4.5v11A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5V8"/><path d="M14 2.5v5M11.5 5h5"/></svg></button>
        <button id="btn-new-folder" class="icon-btn" title="New folder" aria-label="New folder">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h3.5l1.7 2H16a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 16 16H4a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M10 9v4M8 11h4"/></svg></button>
        <button id="btn-sort" class="icon-btn" title="Sort notes" aria-label="Sort notes" aria-haspopup="menu">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 16V4M3.5 7l3-3 3 3M13.5 4v12M10.5 13l3 3 3-3"/></svg></button>
        <button id="btn-theme" class="icon-btn" title="Switch theme" aria-label="Switch theme">
          <svg id="icon-moon" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 11.5A6.5 6.5 0 0 1 8.5 3.5a6.5 6.5 0 1 0 8 8z"/></svg>
          <svg id="icon-sun" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg></button>
        <button id="btn-collapse" class="icon-btn" title="Collapse sidebar (Ctrl/Cmd+\)" aria-label="Collapse sidebar" aria-expanded="true">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="14" height="13" rx="2"/><path d="M8 3.5v13"/></svg></button>
      </div>
    </div>
    <nav id="tree" aria-label="Note tree"></nav>
  </aside>
  <div id="rail" aria-label="Collapsed sidebar">
    <button id="rail-expand" class="icon-btn" title="Show sidebar (Ctrl/Cmd+\)" aria-label="Show sidebar">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="14" height="13" rx="2"/><path d="M8 3.5v13"/></svg></button>
    <button id="rail-new-note" class="icon-btn" title="New note (Ctrl/Cmd+Alt+N)" aria-label="New note">
<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M11 3H5.5A1.5 1.5 0 0 0 4 4.5v11A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5V8"/><path d="M14 2.5v5M11.5 5h5"/></svg></button>
  </div>
  <div id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" aria-valuemin="180" aria-valuemax="600" tabindex="0"></div>
  <main id="main">
    <div class="tabbar" role="tablist" aria-label="Open notes">
      <div id="tabs" class="tabs"></div>
      <button id="tab-new" class="icon-btn" title="New note in a new tab (Ctrl/Cmd+Alt+N)" aria-label="New tab">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg></button>
    </div>
    <header class="topbar">
      <div class="nav-btns" role="group" aria-label="Note history">
        <button id="btn-back" class="icon-btn" title="Back" aria-label="Back to the previous note" disabled>
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10H4.5M9.5 5l-5 5 5 5"/></svg></button>
        <button id="btn-forward" class="icon-btn" title="Forward" aria-label="Forward to the next note" disabled>
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h11.5M10.5 5l5 5-5 5"/></svg></button>
      </div>
      <span class="tb-divider" aria-hidden="true"></span>
      <div class="seg" role="group" aria-label="Mode">
        <button data-mode-btn="edit" class="icon-btn" title="Edit (Ctrl/Cmd+E toggles)" aria-label="Edit" aria-pressed="true">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5l3 3M3.5 16.5l.8-3.4L13.6 3.8a1.5 1.5 0 0 1 2.1 0l.5.5a1.5 1.5 0 0 1 0 2.1l-9.3 9.3z"/></svg></button>
        <button data-mode-btn="read" class="icon-btn" title="Read-only (Ctrl/Cmd+E toggles)" aria-label="Read" aria-pressed="false">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.5C8.6 4.4 6.4 4 3.5 4v11c2.9 0 5.1.4 6.5 1.5M10 5.5C11.4 4.4 13.6 4 16.5 4v11c-2.9 0-5.1.4-6.5 1.5M10 5.5v11"/></svg></button>
      </div>
      <span class="tb-divider" aria-hidden="true"></span>
      <button id="btn-export" class="icon-btn" title="Export as Markdown (.md)" aria-label="Export note as Markdown">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5v9M6.5 9.5 10 13l3.5-3.5M4 16.5h12"/></svg></button>
    </header>
    <div id="banner" role="alert" hidden></div>
    <div id="panes" data-mode="edit">
      <div id="editor"></div>
    </div>
  </main>
</div>
<div id="palette" class="palette" hidden>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search">
    <input id="palette-input" type="text" placeholder="Search" aria-label="Search" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palette-results">
    <div id="palette-results" role="listbox" aria-label="Search results"></div>
    <div class="palette-foot"><span><kbd>&uarr;</kbd><kbd>&darr;</kbd> select</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span><span class="palette-tip">Try <b>author:Sam</b> or <b>tags:todo</b></span></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
